# Publishes the website on every push to main.
# Before publishing it writes the plain-text menu into menu.html from menu-data.js
# (tools/build-menu.js). If menu-data.js has a mistake, this stops and the live site stays as it was;
# GitHub emails you, and the run's log on the Actions tab says which line to fix.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the sitemap can show when each page last changed

      - name: Build the plain-text menu into menu.html
        run: node tools/build-menu.js

      # Newer phones download a .webp copy of each photo (about 40% smaller); older phones use the .jpg.
      # The copies are normally already in the repo (tools/make-webp.py). This makes any that are
      # missing or older than their .jpg, e.g. for a photo added or replaced on GitHub.
      # If it can't, the site still works: script.js loads the .jpg when a .webp is missing.
      - name: Make the lighter .webp copy of any new or replaced photo
        run: |
          changed() { git log -1 --format=%ct -- "$1"; }
          missing=$(find assets -name '*.jpg' -not -path '*/large/*' | while read -r f; do
            w="${f%.jpg}.webp"
            if [ ! -f "$w" ] || [ "$(changed "$f")" -gt "$(changed "$w")" ]; then echo "$f"; fi
          done)
          if [ -z "$missing" ]; then echo "Every photo already has an up-to-date .webp copy."; exit 0; fi
          echo "$missing"
          sudo apt-get install -y -q webp >/dev/null || { echo "Could not install the converter; these photos stay .jpg."; exit 0; }
          echo "$missing" | while read -r f; do
            cwebp -quiet -q 74 "$f" -o "${f%.jpg}.webp" || rm -f "${f%.jpg}.webp"
            # The three 1800px page-top photos also have a 900px copy for phones.
            case "$f" in assets/gallery/cafe-interior.jpg|assets/gallery/pastry-case.jpg|assets/gallery/cappuccino.jpg)
              cwebp -quiet -q 74 -resize 900 0 "$f" -o "${f%.jpg}-900.webp" || true ;;
            esac
          done

      - name: Collect the website files (not README, tools or workflow)
        run: |
          mkdir _site
          cp -r *.html *.js *.css sitemap.xml robots.txt llms.txt assets _site/

      # Browsers keep a saved copy of each file for up to 10 minutes (GitHub's setting).
      # Giving menu-data.js, script.js and styles.css a new address on every publish
      # (e.g. menu-data.js?v=0be6400a) means a freshly loaded page never runs an old copy
      # of the menu. Only the published copy changes; the files in the repo stay as they are.
      - name: Give the scripts and styles a new address on every publish
        run: |
          v="${GITHUB_SHA::8}"
          # ([^\"]*\/)? also matches 404.html, which writes these files with the site folder in front.
          sed -i -E "s/(src|href)=\"([^\"]*\/)?(menu-data\.js|script\.js|styles\.css)\"/\1=\"\2\3?v=$v\"/g" _site/*.html
          for f in _site/*.html; do
            n=$(grep -o -E "(menu-data\.js|script\.js|styles\.css)\?v=$v" "$f" | wc -l)
            echo "$f: $n of 3 links versioned"
            [ "$n" -eq 3 ] || { echo "Expected 3 in $f. Check its <head> still loads styles.css, menu-data.js and script.js."; exit 1; }
          done

      # Short links: the published pages link to /menu, /about and so on, without ".html"
      # (GitHub Pages serves menu.html at /menu). The files in the repo keep "menu.html"
      # so the site still works when opened straight from the folder on a computer.
      - name: Take ".html" off the links between pages
        run: |
          sed -i -E 's/href="(menu|about|gallery|reviews|contact)\.html/href="\1/g' _site/*.html _site/script.js
          sed -i -E 's/href="index\.html/href=".\//g' _site/*.html _site/script.js
          if grep -n -E 'href="[^":]*\.html' _site/*.html _site/script.js; then echo "A link above still ends in .html"; exit 1; fi

      # Tells Google when each page last changed, so it rechecks the menu soon after a price edit.
      # The date comes from git; the menu page counts menu-data.js changes too.
      - name: Add last-updated dates to the sitemap
        run: |
          for page in index about menu gallery reviews contact; do
            files="$page.html"
            [ "$page" = menu ] && files="menu.html menu-data.js"
            d=$(git log -1 --format=%cs -- $files)
            if [ "$page" = index ]; then end='/'; else end="/$page"; fi
            sed -i -E "s#<loc>[^<]*${end}</loc>#&<lastmod>$d</lastmod>#" _site/sitemap.xml
          done
          cat _site/sitemap.xml
          [ "$(grep -o '<lastmod>[0-9-]*</lastmod>' _site/sitemap.xml | wc -l)" -eq 6 ] || { echo "Expected 6 dates in sitemap.xml"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
