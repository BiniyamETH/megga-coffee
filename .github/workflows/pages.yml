# Publishes the website on every push to main.
# Before publishing it writes the plain-text menu into menu.html from menu-data.js
# (tools/build-menu.js). If menu-data.js has a mistake, this stops and the live site stays as it was;
# GitHub emails you, and the run's log on the Actions tab says which line to fix.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the sitemap can show when each page last changed

      - name: Build the plain-text menu into menu.html
        run: node tools/build-menu.js

      - name: Collect the website files (not README, tools or workflow)
        run: |
          mkdir _site
          cp -r *.html *.js *.css sitemap.xml assets _site/

      # Browsers keep a saved copy of each file for up to 10 minutes (GitHub's setting).
      # Giving menu-data.js, script.js and styles.css a new address on every publish
      # (e.g. menu-data.js?v=0be6400a) means a freshly loaded page never runs an old copy
      # of the menu. Only the published copy changes; the files in the repo stay as they are.
      - name: Give the scripts and styles a new address on every publish
        run: |
          v="${GITHUB_SHA::8}"
          # ([^\"]*\/)? also matches 404.html, which writes these files with the site folder in front.
          sed -i -E "s/(src|href)=\"([^\"]*\/)?(menu-data\.js|script\.js|styles\.css)\"/\1=\"\2\3?v=$v\"/g" _site/*.html
          for f in _site/*.html; do
            n=$(grep -o -E "(menu-data\.js|script\.js|styles\.css)\?v=$v" "$f" | wc -l)
            echo "$f: $n of 3 links versioned"
            [ "$n" -eq 3 ] || { echo "Expected 3 in $f. Check its <head> still loads styles.css, menu-data.js and script.js."; exit 1; }
          done

      # Tells Google when each page last changed, so it rechecks the menu soon after a price edit.
      # The date comes from git; the menu page counts menu-data.js changes too.
      - name: Add last-updated dates to the sitemap
        run: |
          for page in index about menu gallery reviews contact; do
            files="$page.html"
            [ "$page" = menu ] && files="menu.html menu-data.js"
            d=$(git log -1 --format=%cs -- $files)
            if [ "$page" = index ]; then end='/'; else end="/$page.html"; fi
            sed -i -E "s#<loc>[^<]*${end}</loc>#&<lastmod>$d</lastmod>#" _site/sitemap.xml
          done
          cat _site/sitemap.xml
          [ "$(grep -o '<lastmod>[0-9-]*</lastmod>' _site/sitemap.xml | wc -l)" -eq 6 ] || { echo "Expected 6 dates in sitemap.xml"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
